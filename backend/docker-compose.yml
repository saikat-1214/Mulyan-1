version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: sih26034_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sih26034
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
