services:
  - type: web
    name: sih2026-backend
    env: docker
    region: oregon
    plan: free # Note: AI models might require upgrading to a paid plan if they exceed 512MB RAM
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sih2026-db
          property: connectionString
      - key: PORT
        value: 8000
      - key: GEMINI_API_KEY
        sync: false # You will need to add this manually in the Render dashboard

databases:
  - name: sih2026-db
    plan: free
    region: oregon
    postgresMajorVersion: 15
